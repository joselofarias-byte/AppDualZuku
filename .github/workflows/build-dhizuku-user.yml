name: Build Dhizuku managed-user test APK

on:
  workflow_dispatch:
  push:
    branches:
      - chatgpt/dhizuku-managed-user-20260930
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AppDual-Dhizuku-managed-user-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
